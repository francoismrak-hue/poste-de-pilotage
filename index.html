function threadById(id){return threadMap.get(id)||null}
function roleById(id){return roleMap.get(id)||null}

function roleThreadsSet(roleId){
  const direct=new Set(DATA.threads.filter(t=>(t.roleIds||[]).includes(roleId)||t.primaryRoleId===roleId).map(t=>t.id));
  let changed=true;
  while(changed){
    changed=false;
    DATA.threads.forEach(t=>{
      if(t.parentId&&direct.has(t.parentId)&&!direct.has(t.id)){direct.add(t.id);changed=true}
      if(direct.has(t.id)&&t.parentId&&!direct.has(t.parentId)){direct.add(t.parentId);changed=true}
    });
  }
  return direct;
}
function threadRange(t){
  const hs=DATA.history.filter(h=>h.threadId===t.id).map(h=>D(h.date)).filter(Boolean);
  const ns=DATA.nodes.filter(n=>n.threadId===t.id).map(n=>D(n.date||n.deadline)).filter(Boolean);
  const dates=[D(t.startDate),D(t.endDate),...hs,...ns].filter(Boolean);
  if(!dates.length)return[viewStart,viewEnd];
  return[new Date(Math.min(...dates)),new Date(Math.max(...dates))];
}
function intersectsWindow(t){
  if(!timeMode)return true;
  const [a,b]=threadRange(t);
  return b>=viewStart&&a<=viewEnd;
}
function visibleThreadPool(){
  let pool=DATA.threads.slice();
  if(selectedDomainId)pool=pool.filter(t=>t.domainId===selectedDomainId || (selectedRoleId&&(t.roleIds||[]).includes(selectedRoleId)));
  if(selectedRoleId){
    const keep=roleThreadsSet(selectedRoleId);
    pool=pool.filter(t=>keep.has(t.id));
  }
  if(filterState!=="all")pool=pool.filter(t=>t.state===filterState);
  if(!showSecondary)pool=pool.filter(t=>t.displayLevel!=="secondary" || t.heat>=4 || !t.parentId);
  pool=pool.filter(intersectsWindow);
  return pool;
}
function childMap(pool){
  const ids=new Set(pool.map(t=>t.id)),m=new Map();
  pool.forEach(t=>{
    if(t.parentId&&ids.has(t.parentId)){
      if(!m.has(t.parentId))m.set(t.parentId,[]);
      m.get(t.parentId).push(t);
    }
  });
  return m;
}
function sortThreads(arr){
  return arr.sort((a,b)=>(b.heat-a.heat)||(stateRank(b.state)-stateRank(a.state))||((D(a.startDate)||0)-(D(b.startDate)||0))||a.title.localeCompare(b.title,"fr"));
}
function computeRows(){
  const pool=visibleThreadPool();
  const ids=new Set(pool.map(t=>t.id));
  const children=childMap(pool);
  const roots=sortThreads(pool.filter(t=>!t.parentId||!ids.has(t.parentId)));
  const rows=[];
  const walk=(t,depth)=>{
    rows.push({t,depth});
    sortThreads([...(children.get(t.id)||[])]).forEach(c=>walk(c,depth+1));
  };
  roots.forEach(r=>walk(r,0));
  layout.rows=rows;
  layout.yById=new Map();
  const top=88;
  rows.forEach((r,i)=>layout.yById.set(r.t.id,top+i*rowGap));
  layout.height=Math.max(graphScroll.clientHeight+120,top+Math.max(1,rows.length)*rowGap+180);
}
function xDate(d){return TREE_W+(d-viewStart)/DAY*pxPerDay}
function dateX(x){return new Date(viewStart.getTime()+((x-TREE_W)/pxPerDay)*DAY)}
function worldWidth(){
  if(!timeMode)return Math.max(graphScroll.clientWidth+600,TREE_W+1250);
  return Math.max(graphScroll.clientWidth+500,TREE_W+((viewEnd-viewStart)/DAY)*pxPerDay+260);
}

function svgEl(name,attrs={}){
  const el=document.createElementNS("http://www.w3.org/2000/svg",name);
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  return el;
}
function clear(el){while(el.firstChild)el.removeChild(el.firstChild)}
function line(x1,y1,x2,y2,cls){
  svg.appendChild(svgEl("line",{x1,y1,x2,y2,class:cls}));
}

function renderAxis(){
  clear(axisWorld);
  if(!timeMode)return;
  axisWorld.style.width=(worldWidth()-TREE_W)+"px";
  let m=new Date(viewStart.getFullYear(),viewStart.getMonth(),1),i=0,first=true;
  while(m<viewEnd){
    const n=new Date(m.getFullYear(),m.getMonth()+1,1);
    const a=new Date(Math.max(viewStart,m)),b=new Date(Math.min(viewEnd,n));
    if(b>a){
      const x=(a-viewStart)/DAY*pxPerDay,w=(b-a)/DAY*pxPerDay;
      const band=document.createElement("div");band.className="monthBand"+(i%2?" alt":"");band.style.left=x+"px";band.style.width=Math.max(1,w)+"px";axisWorld.appendChild(band);
      if(w>40){
        const lab=document.createElement("div");lab.className="monthLabel";lab.style.left=x+"px";lab.style.width=(w-2)+"px";
        lab.textContent=m.toLocaleDateString("fr-FR",{month:"short"})+((first||m.getMonth()===0)?" "+m.getFullYear():"");axisWorld.appendChild(lab)
      }
      line(TREE_W+x,AXIS_H,TREE_W+x,layout.height,"gridV");first=false
    }
    m=n;i++
  }
}
function roleEntryY(){
  const active=[...roleRail.querySelectorAll(".roleBtn")].find(b=>b.classList.contains("active"));
  if(!active)return 110;
  return roleRail.offsetTop+active.offsetTop+active.offsetHeight/2;
}
function renderGlobal(){
  const domains=DATA.domains.slice().sort((a,b)=>a.order-b.order);
  const top=95, gap=Math.max(64,Math.min(92,(graphScroll.clientHeight-180)/Math.max(1,domains.length)));
  domains.forEach((d,i)=>{
    const y=top+i*gap;
    line(TREE_W,y,worldWidth()-80,y,"threadLine");
    const ts=sortThreads(DATA.threads.filter(t=>t.domainId===d.id&&t.state!=="closed")).slice(0,3);
    ts.forEach((t,j)=>{
      const x=timeMode?clamp(xDate(D(t.startDate)||viewStart),TREE_W+40,worldWidth()-260):TREE_W+160+j*240;
      const lab=document.createElement("div");lab.className="threadLabel";lab.style.left=(x+6)+"px";lab.style.top=(y-15+j*22)+"px";lab.textContent=t.title;lab.onclick=()=>{selectedDomainId=d.id;selectedRoleId=t.primaryRoleId;selectedThreadId=t.id;renderAll();showThreadDetail(t.id)};labels.appendChild(lab)
    });
  });
}
function renderThreads(){
  const rows=layout.rows;if(!rows.length)return;
  const entryY=roleEntryY(), trunkX=TREE_W+22;
  line(TREE_W,entryY,trunkX,entryY,"trunk");

  const rootYs=rows.filter(r=>r.depth===0).map(r=>layout.yById.get(r.t.id));
  if(rootYs.length)line(trunkX,Math.min(entryY,...rootYs),trunkX,Math.max(entryY,...rootYs),"trunk");

  const geom=new Map();
  rows.forEach((r,idx)=>{
    const t=r.t,y=layout.yById.get(t.id);
    let branchX=trunkX+r.depth*16;
    if(r.depth>0&&t.parentId&&geom.has(t.parentId))branchX=geom.get(t.parentId).branchX+16;
    let startX,endX;
    if(timeMode){
      const [a,b]=threadRange(t);
      startX=clamp(xDate(a),TREE_W+65,worldWidth()-240);
      endX=clamp(xDate(b),startX+120,worldWidth()-60);
    }else{
      startX=TREE_W+170+r.depth*28;
      endX=startX+Math.max(430,graphScroll.clientWidth*.54);
    }
    line(branchX,y,startX,y,"threadLine"+(t.displayLevel==="secondary"?" secondary":"")+(t.id===selectedThreadId?" selected":""));
    line(startX,y,endX,y,"threadLine"+(t.displayLevel==="secondary"?" secondary":"")+(t.id===selectedThreadId?" selected":""));
    if(r.depth===0)line(trunkX,y,branchX,y,"trunk");
    else if(t.parentId&&geom.has(t.parentId)){
      const pg=geom.get(t.parentId);
      line(pg.branchX,pg.y,pg.branchX,y,"trunk");line(pg.branchX,y,branchX,y,"trunk")
    }
    geom.set(t.id,{branchX,y,startX,endX});

    const lab=document.createElement("div");
    lab.className="threadLabel"+(t.displayLevel==="secondary"?" secondary":"")+(t.id===selectedThreadId?" selected":"");
    lab.style.left=(startX+7)+"px";lab.style.top=(y-15)+"px";lab.textContent=t.title;
    lab.onclick=()=>{selectedThreadId=t.id;renderAll();showThreadDetail(t.id)};
    labels.appendChild(lab);

    if(timeMode){
      const nodes=DATA.nodes.filter(n=>n.threadId===t.id&&(n.date||n.deadline));
      nodes.forEach(n=>{
        const d=D(n.date||n.deadline);if(!d||d<viewStart||d>viewEnd)return;
        const x=clamp(xDate(d),startX,endX);
        const c=svgEl("circle",{cx:x,cy:y,r:n.status==="scheduled"?7:5,class:"nodeShape"+(t.heat>=5?" hot":"")});
        c.addEventListener("click",e=>{e.stopPropagation();selectedNodeId=n.id;showNodeDetail(n.id)});svg.appendChild(c)
      });
      const hs=DATA.history.filter(h=>h.threadId===t.id);
      hs.forEach(h=>{
        const d=D(h.date);if(!d||d<viewStart||d>viewEnd)return;
        const x=clamp(xDate(d),startX,endX);
        const c=svgEl("circle",{cx:x,cy:y,r:3.7,class:"historyDot"});c.addEventListener("click",e=>{e.stopPropagation();showHistoryDetail(h.id)});svg.appendChild(c)
      });
    }
  });

  if(rowGap>=92){
    rows.forEach((r,i)=>{
      const t=r.t,y=layout.yById.get(t.id),g=geom.get(t.id);
      const nodes=DATA.nodes.filter(n=>n.threadId===t.id&&(n.date||n.deadline)).slice(0,12);
      nodes.forEach((n,j)=>{
        const d=D(n.date||n.deadline);if(timeMode&&(!d||d<viewStart||d>viewEnd))return;
        const x=timeMode?clamp(xDate(d),g.startX,g.endX):g.startX+120+j*90;
        const stem=(j%2?-1:1)*Math.min(74,rowGap*.33);
        line(x,y,x,y+stem,"trunk");
        const div=document.createElement("div");div.className="nodeDetailLabel";div.style.left=(x+6)+"px";div.style.top=(y+stem+(stem<0?-27:5))+"px";
        div.innerHTML="<strong>"+esc(fmt(d))+"</strong> "+esc(n.title);labels.appendChild(div)
      })
    })
  }
}
function renderCursor(){
  const old=svg.querySelectorAll(".todayLine,.cursorLine,.cursorHandle,.cursorHit");old.forEach(x=>x.remove());
  if(!timeMode){cursorLabel.style.display="none";return}
  cursorLabel.style.display="block";
  const today=clamp(xDate(new Date()),TREE_W,worldWidth()-1);
  line(today,0,today,layout.height,"todayLine");
  cursorDate=new Date(clamp(cursorDate,viewStart,viewEnd));
  const x=clamp(xDate(cursorDate),TREE_W,worldWidth()-1);
  line(x,0,x,layout.height,"cursorLine");
  const hit=svgEl("rect",{x:x-13,y:0,width:26,height:layout.height,class:"cursorHit"});
  hit.addEventListener("pointerdown",e=>{cursorDragging=true;hit.setPointerCapture?.(e.pointerId);e.preventDefault();e.stopPropagation()});svg.appendChild(hit);
  const h=svgEl("circle",{cx:x,cy:AXIS_H/2,r:8,class:"cursorHandle"});svg.appendChild(h);
  cursorLabel.style.left=x+"px";cursorLabel.style.top="3px";cursorLabel.textContent=cursorDate.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short",year:"numeric"})
}
function renderGraph(){
  computeRows();clear(svg);clear(labels);
  layout.width=worldWidth();world.style.width=layout.width+"px";world.style.height=layout.height+"px";
  svg.setAttribute("width",layout.width);svg.setAttribute("height",layout.height);
  renderAxis();
  for(let y=80;y<layout.height;y+=rowGap)line(TREE_W,y,layout.width,y,"gridH");
  selectedDomainId?renderThreads():renderGlobal();
  renderCursor()
}

function scopeThreadIds(){
  if(selectedThreadId)return new Set([selectedThreadId]);
  if(selectedRoleId)return roleThreadsSet(selectedRoleId);
  if(selectedDomainId)return new Set(DATA.threads.filter(t=>t.domainId===selectedDomainId).map(t=>t.id));
  return new Set(DATA.threads.map(t=>t.id))
}
function showCursorDetail(){
  const ids=scopeThreadIds(),events=[];
  DATA.history.filter(h=>ids.has(h.threadId)).forEach(h=>events.push({date:D(h.date),kind:"Historique",text:h.summary,thread:threadById(h.threadId)?.title||""}));
  DATA.nodes.filter(n=>ids.has(n.threadId)&&(n.date||n.deadline)).forEach(n=>events.push({date:D(n.date||n.deadline),kind:"Nœud / tâche",text:n.title,thread:threadById(n.threadId)?.title||""}));
  const near=events.filter(e=>e.date&&Math.abs(e.date-cursorDate)<=75*DAY).sort((a,b)=>Math.abs(a.date-cursorDate)-Math.abs(b.date-cursorDate)).slice(0,14);
  const scope=selectedThreadId?threadById(selectedThreadId)?.title:selectedRoleId?roleName(selectedRoleId):selectedDomainId?domainName(selectedDomainId):"Global";
  detail.innerHTML='<div class="card primary"><div class="kicker">Curseur temps</div><div class="breadcrumb"><strong>'+esc(scope)+'</strong></div><div class="cursorDate">'+esc(cursorDate.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}))+'</div></div><div class="card"><div class="kicker">Autour de cette date</div>'+(near.length?near.map(e=>'<div class="event"><div class="when">'+esc(fmt(e.date))+' · '+esc(e.kind)+'</div><div class="what">'+esc(e.text)+'</div><div class="scope">'+esc(e.thread)+'</div></div>').join(""):'<p class="small">Aucun élément proche de cette date.</p>')+'</div>'
}

function pointerDate(clientX){
  const rect=graphScroll.getBoundingClientRect();
  return new Date(clamp(dateX(clientX-rect.left+graphScroll.scrollLeft),viewStart,viewEnd))
}
window.addEventListener("pointermove",e=>{if(!cursorDragging)return;cursorDate=pointerDate(e.clientX);renderGraph();showCursorDetail();e.preventDefault()},{passive:false});
window.addEventListener("pointerup",()=>cursorDragging=false);
window.addEventListener("pointercancel",()=>cursorDragging=false);

timeToggle.onclick=()=>{timeMode=!timeMode;document.body.classList.toggle("timeOff",!timeMode);timeToggle.classList.toggle("off",!timeMode);timeToggle.textContent=timeMode?"TIME ON":"TIME OFF";renderAll()};

graphScroll.addEventListener("wheel",e=>{
  if(e.ctrlKey){
    e.preventDefault();
    const rect=graphScroll.getBoundingClientRect(),local=e.clientX-rect.left+graphScroll.scrollLeft;
    const anchor=dateX(local),old=pxPerDay;
    pxPerDay=clamp(pxPerDay*Math.exp(-e.deltaY*.0015),1.1,38);
    const newX=xDate(anchor);
    renderAll();
    graphScroll.scrollLeft=Math.max(0,newX-(e.clientX-rect.left));
  }else if(e.altKey){
    e.preventDefault();
    const rect=graphScroll.getBoundingClientRect(),localY=e.clientY-rect.top+graphScroll.scrollTop;
    const old=rowGap;
    rowGap=clamp(rowGap*Math.exp(-e.deltaY*.0019),28,360);
    const ratio=rowGap/old;
    renderAll();
    graphScroll.scrollTop=Math.max(0,localY*ratio-(e.clientY-rect.top));
  }
},{passive:false});

document.getElementById("fileInput").onchange=e=>{
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(String(r.result));
      loadData(obj,true);
    }catch(err){alert("JSON invalide : "+err.message)}
  };
  r.readAsText(f,"utf-8")
};

function saveView(){
  try{localStorage.setItem(STORAGE_VIEW,JSON.stringify({selectedDomainId,selectedRoleId,selectedThreadId,filterState,showSecondary,timeMode,pxPerDay,rowGap,cursorDate:cursorDate.toISOString()}))}catch(e){}
}
function restoreView(){
  try{
    const s=JSON.parse(localStorage.getItem(STORAGE_VIEW)||"null");if(!s)return;
    selectedDomainId=s.selectedDomainId??selectedDomainId;selectedRoleId=s.selectedRoleId??selectedRoleId;selectedThreadId=s.selectedThreadId??selectedThreadId;
    filterState=s.filterState||filterState;showSecondary=!!s.showSecondary;timeMode=s.timeMode!==false;pxPerDay=s.pxPerDay||pxPerDay;rowGap=s.rowGap||rowGap;cursorDate=s.cursorDate?new Date(s.cursorDate):cursorDate
  }catch(e){}
}
function validData(o){return o&&o.meta&&Array.isArray(o.domains)&&Array.isArray(o.roles)&&Array.isArray(o.threads)&&Array.isArray(o.nodes)&&Array.isArray(o.history)}
function loadData(o,persist=false){
  if(!validData(o))throw new Error("Schéma PILOT v2.5 attendu.");
  DATA=o;rebuildMaps();
  const dw=DATA.meta.defaultWindow;if(dw){viewStart=D(dw.start);viewEnd=D(dw.end)}
  if(persist){try{localStorage.setItem(STORAGE_JSON,JSON.stringify(o))}catch(e){}}
  restoreView();
  cursorDate=clamp(cursorDate,viewStart,viewEnd);
  renderAll();
  if(selectedThreadId)showThreadDetail(selectedThreadId);else if(selectedRoleId)showRoleDetail(selectedRoleId);else if(selectedDomainId)showDomainDetail(selectedDomainId);else showGlobalDetail()
}
async function boot(){
  let remote=null;
  try{
    const r=await fetch("data/current.json?build="+encodeURIComponent(BUILD)+"&t="+Date.now(),{cache:"no-store"});
    if(r.ok)remote=await r.json()
  }catch(e){}
  if(validData(remote)){loadData(remote,true);return}
  try{
    const stored=JSON.parse(localStorage.getItem(STORAGE_JSON)||"null");
    if(validData(stored)){loadData(stored,false);return}
  }catch(e){}
  const embedded=JSON.parse(document.getElementById("embedded-data").textContent||"{}");
  loadData(embedded,true)
}
boot();
</script>
</body>
